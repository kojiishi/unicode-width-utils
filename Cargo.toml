[package]
name = "unicode-width-utils"
version = "0.2.6"
edition = "2024"
description = "Line wrapping and truncation by using `unicode-width`"
authors = ["Koji Ishii <kojiishi@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/kojiishi/unicode-width-utils"
documentation = "https://docs.rs/unicode-width-utils/"
readme = "README.md"
keywords = ["unicode", "unicode-width", "text", "cjk"]
categories = ["internationalization", "text-processing"]
exclude = [".github", ".gitignore", ".vscode", "Taskfile.yml"]

[dependencies]
regex = "1.13.1"
unicode-width = "0.2.2"
